<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSI Pilot — Bike Tire Pressure Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f2ece4;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: #1a1a1a; color: #fff; }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .hero-inner { padding: 0 28px; }

  /* ── Hero ── */
  .hero {
    background: #1a1a2e;
    color: #fff;
    padding: 32px 0 28px;
  }
  .hero h1 {
    font-size: 2.4rem; font-weight: 900; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .hero h1 span { color: #4fc3a1; }
  .hero .sub {
    font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.55);
    margin-top: 4px;
  }

  /* ── Card ── */
  .card {
    background: #fff;
    border: 2px solid #1a1a1a;
    border-radius: 14px;
    box-shadow: 5px 5px 0 #1a1a1a;
    padding: 24px 28px;
    margin-top: 24px;
  }
  .card h2 {
    font-size: 1rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 18px;
    color: #555;
  }

  /* ── Field ── */
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .field label, .field-legend {
    display: block;
    font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 8px; color: #777;
  }
  fieldset { border: none; }
  .field-legend { padding: 0; }

  /* ── Radio Group ── */
  .radio-group {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .radio-card {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 8px;
    border: 2px solid #1a1a1a; border-radius: 10px;
    background: #fefcf9;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
  }
  .radio-card:hover { transform: translateY(-2px); box-shadow: 3px 3px 0 #1a1a1a; }
  .radio-card input { position: absolute; opacity: 0; width: 0; height: 0; }
  .radio-card:has(input:checked) {
    background: #1a1a1a; color: #fff; transform: translateY(-2px);
    box-shadow: 3px 3px 0 #4fc3a1;
  }
  .radio-card:focus-within { outline: 3px solid #4fc3a1; outline-offset: 2px; }

  /* ── Weight Input ── */
  .weight-row {
    display: flex; gap: 8px; align-items: stretch;
  }
  .weight-row input {
    flex: 1; padding: 11px 14px;
    border: 2px solid #1a1a1a; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700;
    background: #fefcf9; color: #1a1a1a; outline: none;
    min-width: 0;
  }
  .weight-row input:focus {
    border-color: #4fc3a1; box-shadow: 0 0 0 3px rgba(79,195,161,0.25);
  }
  .weight-row input::placeholder { font-weight: 600; color: #bbb; }
  .unit-btn {
    padding: 0 18px;
    border: 2px solid #1a1a1a; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 800;
    background: #fff; color: #1a1a1a; cursor: pointer;
    transition: background 0.12s, transform 0.12s;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .unit-btn:hover { background: #f0ede8; transform: translateY(-1px); }
  .unit-btn:focus-visible { outline: 3px solid #4fc3a1; outline-offset: 2px; }

  .error-msg {
    font-size: 0.7rem; font-weight: 700; color: #e53935;
    margin-top: 6px; min-height: 1em;
  }

  /* ── Results ── */
  .psi-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .psi-box {
    background: #f8f5f0; border: 2px solid #1a1a1a; border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .psi-box .wheel-label {
    font-size: 0.6rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; color: #999;
  }
  .psi-box .psi-value {
    font-size: 2rem; font-weight: 900; letter-spacing: -0.02em;
    margin-top: 2px;
    color: #1a1a1a;
  }
  .psi-box .psi-unit {
    font-size: 0.75rem; font-weight: 700; color: #999;
  }
  .psi-placeholder {
    text-align: center; padding: 24px 12px;
    font-size: 0.8rem; font-weight: 600; color: #bbb;
  }

  /* ── Bar ── */
  .bar-section { margin-top: 20px; }
  .bar-section h3 {
    font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; color: #999; margin-bottom: 10px;
  }
  .bar-track {
    position: relative; height: 28px;
    background: #e0d8d0; border: 2px solid #1a1a1a; border-radius: 8px;
    overflow: hidden;
  }
  .bar-zone {
    position: absolute; top: 0; height: 100%;
    border-radius: 0;
    transition: left 0.2s, width 0.2s;
  }
  .bar-too-low { background: #ffe0b2; left: 0; }
  .bar-ideal   { background: #a5d6a7; z-index: 1; }
  .bar-too-high { background: #ef9a9a; right: 0; }
  .bar-marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #1a1a1a; z-index: 2;
    transition: left 0.2s;
  }
  .bar-marker.front { background: #1a1a1a; }
  .bar-marker.rear  { background: #fff; }
  .bar-labels {
    display: flex; justify-content: space-between;
    font-size: 0.6rem; font-weight: 700; color: #999;
    margin-top: 4px; text-transform: uppercase;
  }
  .bar-legend {
    display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap;
  }
  .bar-legend span {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.6rem; font-weight: 700; color: #666;
  }
  .bar-legend .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid #1a1a1a; flex-shrink: 0;
  }

  /* ── Check ── */
  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check-field { margin-bottom: 0; }
  .check-field label {
    font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; color: #999; margin-bottom: 6px;
  }
  .check-field input {
    width: 100%; padding: 10px 12px;
    border: 2px solid #1a1a1a; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700;
    background: #fefcf9; color: #1a1a1a; outline: none;
  }
  .check-field input:focus {
    border-color: #4fc3a1; box-shadow: 0 0 0 3px rgba(79,195,161,0.25);
  }
  .check-field input::placeholder { font-weight: 600; color: #ccc; }
  .check-status {
    font-size: 0.75rem; font-weight: 700; margin-top: 6px;
    display: flex; align-items: center; gap: 5px;
  }
  .check-status .badge {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    font-size: 0.6rem; font-weight: 800; text-transform: uppercase;
    border: 1.5px solid #1a1a1a;
  }
  .badge-under { background: #ffe0b2; color: #e65100; }
  .badge-ideal { background: #a5d6a7; color: #2e7d32; }
  .badge-over  { background: #ef9a9a; color: #c62828; }
  .check-tip {
    font-size: 0.7rem; font-weight: 600; color: #888;
    margin-top: 2px; font-style: italic;
  }

  .check-empty {
    grid-column: 1 / -1;
    text-align: center; padding: 16px;
    font-size: 0.7rem; font-weight: 600; color: #bbb;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .radio-group { grid-template-columns: repeat(2, 1fr); }
    .psi-grid, .check-grid { grid-template-columns: 1fr; }
    .card { padding: 18px 16px; }
    .hero h1 { font-size: 1.8rem; }
  }

  @media (max-width: 400px) {
    .radio-group { grid-template-columns: 1fr 1fr; }
    .weight-row { flex-direction: column; }
    .unit-btn { padding: 10px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="container">
    <div class="hero-inner">
      <h1>PSI <span>Pilot</span></h1>
      <p class="sub">Find your ideal tire pressure — just pick your bike and enter your weight.</p>
    </div>
  </div>
</header>

<main class="container">

  <!-- ── Setup ── -->
  <section class="card" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Your Setup</h2>

    <fieldset class="field">
      <legend class="field-legend">Bike Type</legend>
      <div class="radio-group" role="radiogroup" aria-label="Bike type">
        <label class="radio-card">
          <input type="radio" name="bikeType" value="road">
          <span>Road</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="bikeType" value="mountain">
          <span>MTB</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="bikeType" value="gravel">
          <span>Gravel</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="bikeType" value="hybrid">
          <span>Hybrid</span>
        </label>
      </div>
    </fieldset>

    <div class="field">
      <label for="weightInput">Body Weight</label>
      <div class="weight-row">
        <input type="number" id="weightInput" min="1" max="350" step="0.5" placeholder="e.g. 70" autocomplete="off" aria-describedby="weightError">
        <button class="unit-btn" id="unitToggle" aria-label="Switch unit between kilograms and pounds" type="button">kg</button>
      </div>
      <p class="error-msg" id="weightError" role="alert"></p>
    </div>
  </section>

  <!-- ── Recommended ── -->
  <section class="card" aria-labelledby="resultTitle">
    <h2 id="resultTitle">Recommended Pressure</h2>
    <div id="resultBody">
      <p class="psi-placeholder">Select bike type and enter your weight</p>
    </div>
  </section>

  <!-- ── Pressure Check ── -->
  <section class="card" aria-labelledby="checkTitle">
    <h2 id="checkTitle">Check Your Pressure</h2>
    <div id="checkBody">
      <p class="psi-placeholder">Select bike type and enter your weight first</p>
    </div>
  </section>

</main>

<script>
(function() {
  'use strict';

  /* ── Data ── */
  const PRESSURE_DATA = {
    road: {
      label: 'Road',
      maxBar: 140,
      brackets: [
        { max: 60, front: [80, 90], rear: [85, 95] },
        { max: 85, front: [90, 100], rear: [95, 105] },
        { max: Infinity, front: [100, 115], rear: [105, 120] },
      ]
    },
    mountain: {
      label: 'Mountain',
      maxBar: 60,
      brackets: [
        { max: 60, front: [25, 30], rear: [28, 33] },
        { max: 85, front: [28, 33], rear: [30, 35] },
        { max: Infinity, front: [30, 37], rear: [33, 40] },
      ]
    },
    gravel: {
      label: 'Gravel',
      maxBar: 80,
      brackets: [
        { max: 60, front: [35, 42], rear: [38, 45] },
        { max: 85, front: [42, 48], rear: [45, 52] },
        { max: Infinity, front: [48, 55], rear: [52, 58] },
      ]
    },
    hybrid: {
      label: 'Hybrid',
      maxBar: 90,
      brackets: [
        { max: 60, front: [40, 47], rear: [43, 50] },
        { max: 85, front: [47, 54], rear: [50, 57] },
        { max: Infinity, front: [54, 62], rear: [57, 65] },
      ]
    }
  };

  const TIPS = {
    under: {
      front: "Too low up front — you risk pinch flats. Add some air!",
      rear: "Rear's looking soft. Pump it up for better efficiency."
    },
    ideal: {
      front: "Front pressure is spot on. Smooth ride ahead!",
      rear: "Rear pressure is perfect. Roll on!"
    },
    over: {
      front: "Front's too hard — you're losing traction. Let a little out.",
      rear: "Rear's overinflated. Drop a few PSI for better grip."
    }
  };

  /* ── State ── */
  let bikeType = null;
  let weightKg = null;
  let unit = 'kg'; // 'kg' or 'lbs'

  /* ── DOM refs ── */
  const $ = id => document.getElementById(id);
  const weightInput = $('weightInput');
  const unitToggle = $('unitToggle');
  const weightError = $('weightError');
  const resultBody = $('resultBody');
  const checkBody = $('checkBody');
  const bikeRadios = document.querySelectorAll('input[name="bikeType"]');

  /* ── Utils ── */
  function toKg(val, u) {
    return u === 'kg' ? val : val * 0.453592;
  }
  function toUnit(val, u) {
    return u === 'kg' ? val : val / 0.453592;
  }

  function findBracket(type, weightKg) {
    const bike = PRESSURE_DATA[type];
    if (!bike) return null;
    for (const b of bike.brackets) {
      if (weightKg <= b.max) return b;
    }
    return null;
  }

  function classifyPressure(psi, range) {
    if (psi < range[0]) return 'under';
    if (psi > range[1]) return 'over';
    return 'ideal';
  }

  function esc(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  /* ── Validate ── */
  function validateWeight(val) {
    if (val === '' || val == null) return '';
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0) return 'Enter a positive number.';
    if (unit === 'kg' && (n < 15 || n > 350)) return 'Enter a weight between 15–350 kg.';
    if (unit === 'lbs' && (n < 33 || n > 770)) return 'Enter a weight between 33–770 lbs.';
    return '';
  }

  /* ── Render ── */
  function render() {
    const raw = weightInput.value.trim();
    const err = validateWeight(raw);
    weightError.textContent = err;

    let selectedType = null;
    bikeRadios.forEach(r => { if (r.checked) selectedType = r.value; });
    bikeType = selectedType;

    if (err) {
      resultBody.innerHTML = `<p class="psi-placeholder">${esc(err)}</p>`;
      checkBody.innerHTML = `<p class="psi-placeholder">Fix the weight field first</p>`;
      return;
    }

    if (!bikeType || raw === '') {
      resultBody.innerHTML = `<p class="psi-placeholder">Select bike type and enter your weight</p>`;
      checkBody.innerHTML = `<p class="psi-placeholder">Select bike type and enter your weight first</p>`;
      return;
    }

    const kg = parseFloat(raw);
    if (isNaN(kg)) {
      resultBody.innerHTML = `<p class="psi-placeholder">Enter a valid weight</p>`;
      checkBody.innerHTML = `<p class="psi-placeholder">Enter a valid weight</p>`;
      return;
    }
    weightKg = unit === 'kg' ? kg : toKg(kg, 'kg');

    const bracket = findBracket(bikeType, weightKg);
    if (!bracket) {
      resultBody.innerHTML = `<p class="psi-placeholder">No data for this weight range</p>`;
      checkBody.innerHTML = `<p class="psi-placeholder">No data for this weight range</p>`;
      return;
    }

    const [fLow, fHigh] = bracket.front;
    const [rLow, rHigh] = bracket.rear;
    const bike = PRESSURE_DATA[bikeType];
    const maxBar = bike.maxBar;

    // Results
    resultBody.innerHTML = `
      <div class="psi-grid">
        <div class="psi-box">
          <div class="wheel-label">Front</div>
          <div class="psi-value">${fLow}–${fHigh}</div>
          <div class="psi-unit">PSI</div>
        </div>
        <div class="psi-box">
          <div class="wheel-label">Rear</div>
          <div class="psi-value">${rLow}–${rHigh}</div>
          <div class="psi-unit">PSI</div>
        </div>
      </div>
      <div class="bar-section">
        <h3>Pressure Range</h3>
        ${renderBar(fLow, fHigh, rLow, rHigh, maxBar)}
      </div>
    `;

    // Check
    const frontVal = $('frontCurrent') ? $('frontCurrent').value : '';
    const rearVal = $('rearCurrent') ? $('rearCurrent').value : '';
    checkBody.innerHTML = `
      <div class="check-grid">
        <div class="check-field">
          <label for="frontCurrent">Front Wheel (PSI)</label>
          <input type="number" id="frontCurrent" min="0" max="160" step="0.5" placeholder="e.g. ${fLow}" autocomplete="off" aria-describedby="frontStatus">
          <p class="check-status" id="frontStatus"></p>
          <p class="check-tip" id="frontTip"></p>
        </div>
        <div class="check-field">
          <label for="rearCurrent">Rear Wheel (PSI)</label>
          <input type="number" id="rearCurrent" min="0" max="160" step="0.5" placeholder="e.g. ${rLow}" autocomplete="off" aria-describedby="rearStatus">
          <p class="check-status" id="rearStatus"></p>
          <p class="check-tip" id="rearTip"></p>
        </div>
      </div>
    `;

    // Restore previous values if any
    if (frontVal) $('frontCurrent').value = frontVal;
    if (rearVal) $('rearCurrent').value = rearVal;

    // Wire check inputs
    $('frontCurrent').addEventListener('input', updateCheck);
    $('rearCurrent').addEventListener('input', updateCheck);

    // Run check if values exist
    if (frontVal || rearVal) updateCheck();
  }

  function renderBar(fLow, fHigh, rLow, rHigh, maxBar) {
    const idealStart = Math.min(fLow, rLow);
    const idealEnd = Math.max(fHigh, rHigh);
    const pStart = (idealStart / maxBar) * 100;
    const pWidth = ((idealEnd - idealStart) / maxBar) * 100;
    const pLowEnd = (idealStart / maxBar) * 100;
    const pHighStart = (idealEnd / maxBar) * 100;

    return `
      <div class="bar-track" role="img" aria-label="Pressure bar from 0 to ${maxBar} PSI, ideal zone ${idealStart} to ${idealEnd} PSI">
        <div class="bar-zone bar-too-low" style="width:${pLowEnd}%"></div>
        <div class="bar-zone bar-ideal" style="left:${pStart}%;width:${pWidth}%"></div>
        <div class="bar-zone bar-too-high" style="left:${pHighStart}%;width:${100-pHighStart}%"></div>
        <div class="bar-marker front" style="left:0%" hidden></div>
        <div class="bar-marker rear" style="left:100%" hidden></div>
      </div>
      <div class="bar-labels">
        <span>0</span>
        <span>${maxBar} PSI</span>
      </div>
      <div class="bar-legend">
        <span><span class="dot" style="background:#ffe0b2"></span> Too low</span>
        <span><span class="dot" style="background:#a5d6a7"></span> Ideal</span>
        <span><span class="dot" style="background:#ef9a9a"></span> Too high</span>
        <span><span class="dot" style="background:#1a1a1a"></span> Front</span>
        <span><span class="dot" style="background:#fff;border-color:#1a1a1a"></span> Rear</span>
      </div>
    `;
  }

  function updateCheck() {
    const bike = PRESSURE_DATA[bikeType];
    if (!bike || weightKg == null) return;
    const bracket = findBracket(bikeType, weightKg);
    if (!bracket) return;
    const [fLow, fHigh] = bracket.front;
    const [rLow, rHigh] = bracket.rear;
    const maxBar = bike.maxBar;

    const frontVal = parseFloat($('frontCurrent').value);
    const rearVal = parseFloat($('rearCurrent').value);

    // Update bar markers
    const frontMarker = document.querySelector('.bar-marker.front');
    const rearMarker = document.querySelector('.bar-marker.rear');
    if (frontMarker) {
      if (isNaN(frontVal) || frontVal < 0) {
        frontMarker.hidden = true;
      } else {
        frontMarker.hidden = false;
        frontMarker.style.left = Math.min((frontVal / maxBar) * 100, 100) + '%';
      }
    }
    if (rearMarker) {
      if (isNaN(rearVal) || rearVal < 0) {
        rearMarker.hidden = true;
      } else {
        rearMarker.hidden = false;
        rearMarker.style.left = Math.min((rearVal / maxBar) * 100, 100) + '%';
      }
    }

    // Update status + tip per wheel
    updateWheel('front', frontVal, bracket.front);
    updateWheel('rear', rearVal, bracket.rear);
  }

  function updateWheel(wheel, val, range) {
    const statusEl = $(wheel + 'Status');
    const tipEl = $(wheel + 'Tip');
    if (!statusEl) return;

    if (isNaN(val) || val === '' || val < 0) {
      statusEl.innerHTML = '';
      tipEl.textContent = '';
      return;
    }

    const cls = classifyPressure(val, range);
    const labels = { under: 'Underinflated', ideal: 'Ideal', over: 'Overinflated' };
    const badgeCls = { under: 'badge-under', ideal: 'badge-ideal', over: 'badge-over' };
    const emoji = { under: '\u26A0\uFE0F', ideal: '\u2705', over: '\u26A0\uFE0F' };

    statusEl.innerHTML = `<span class="badge ${badgeCls[cls]}">${emoji[cls]} ${labels[cls]}</span>`;
    statusEl.style.color = cls === 'ideal' ? '#2e7d32' : '#c62828';
    tipEl.textContent = TIPS[cls][wheel];
  }

  /* ── Events ── */
  function onInputChange() {
    const raw = weightInput.value.trim();
    const kg = parseFloat(raw);
    if (raw === '' || isNaN(kg) || kg <= 0) {
      weightKg = null;
      render();
      return;
    }
    weightKg = unit === 'kg' ? kg : toKg(kg, 'kg');
    render();
  }

  weightInput.addEventListener('input', onInputChange);

  unitToggle.addEventListener('click', function() {
    const raw = weightInput.value.trim();
    const currentVal = parseFloat(raw);
    const newUnit = unit === 'kg' ? 'lbs' : 'kg';

    if (!isNaN(currentVal) && currentVal > 0) {
      weightInput.value = Math.round(toUnit(currentVal, newUnit) * 10) / 10;
    }

    unit = newUnit;
    unitToggle.textContent = unit;
    unitToggle.setAttribute('aria-label', 'Switch unit between kilograms and pounds');

    if (weightInput.value.trim()) {
      onInputChange();
    }
  });

  bikeRadios.forEach(r => r.addEventListener('change', function() {
    bikeType = this.value;
    if (weightInput.value.trim()) onInputChange();
    else render();
  }));

  /* ── Init ── */
  render();
})();
